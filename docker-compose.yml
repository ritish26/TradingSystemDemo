services:
  authservice:
    build:
      context: .
      dockerfile: ./Authentication Service/Dockerfile
    image: trading-authservice
    container_name: trading-authservice
    environment:
      ASPNETCORE_URLS: http://+:80
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5006:80"
    networks:
      - trading-network

  seq:
    image: datalust/seq:latest
    container_name: trading-seq
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: Y
    networks:
      - trading-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: trading-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-network

  orderservice:
    build:
      context: .
      dockerfile: ./OrderService/Dockerfile
    image: trading-orderservice
    container_name: trading-orderservice
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
      ASPNETCORE_URLS: http://+:80
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5001:80"
    networks:
      - trading-network

  processingservice:
    build:
      context: .
      dockerfile: ./ProcessingService/Dockerfile
    image: trading-processingservice
    container_name: trading-processingservice
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
      Serilog__WriteTo__1__Args__serverUrl: http://seq:80
      ASPNETCORE_URLS: http://+:80
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5002:80"
    networks:
      - trading-network
        
  postgres:
    image: postgres:15
    container_name: postgres-container
    restart: always
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    networks:
      - trading-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-container
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - trading-network
      
networks:
  trading-network:
    driver: bridge