services:
  vault:
    image: hashicorp/vault:1.15.0
    container_name: trading-vault
    restart: on-failure:5
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: http://localhost:8200
      VAULT_API_ADDR: http://localhost:8200
      VAULT_LOG_LEVEL: info
    volumes:
      - vault-data:/vault/data
      - ./vault-config.hcl:/vault/config/vault.hcl
    command: sh -c "chmod 777 /vault/data 2>/dev/null; vault server -config=/vault/config/vault.hcl"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    cap_add:
      - IPC_LOCK
    networks:
      - trading-network
  
  authservice:
    build:
      context: .
      dockerfile: ./Authentication Service/Dockerfile
    image: trading-authservice
    container_name: trading-authservice
    depends_on:
      vault:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:80
      ASPNETCORE_ENVIRONMENT: Development
      Vault__Address: http://vault:8200
      Vault__KeyName: jwt-signing-key
      Vault__RoleId: a3c027d5-2c7c-dd28-53fc-e8f0edef6c5c
      Vault__SecretId: afeeb4f0-6f73-aab2-84e8-7d1272c4394a
      ConnectionStrings__Redis: redis:6379
      RateLimiting__MaxRequests: "5"
      RateLimiting__WindowSeconds: "300"
    ports:
      - "5006:80"
    networks:
      - trading-network

  seq:
    image: datalust/seq:latest
    container_name: trading-seq
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: true   
    networks:
      - trading-network

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-network
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: trading-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-network

  orderservice:
    build:
      context: .
      dockerfile: ./OrderService/Dockerfile
    image: trading-orderservice
    container_name: trading-orderservice
    depends_on:
      vault:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
      Vault__Address: http://trading-vault:8200
      Vault__KeyName: jwt-signing-key
      Vault__RoleId: 28c74a6c-b9bf-c9f3-b0e9-6e01d7864d3f
      Vault__SecretId: df424098-0f6b-7f59-3c81-fbb61326438e
      ConnectionStrings__Redis: redis:6379
      RateLimiting__MaxRequests: "100"
      RateLimiting__WindowSeconds: "60"
      ASPNETCORE_URLS: http://+:80
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5001:80"
    networks:
      - trading-network

  processingservice:
    build:
      context: .
      dockerfile: ./ProcessingService/Dockerfile
    image: trading-processingservice
    container_name: trading-processingservice
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: guest
      RabbitMQ__Password: guest
      Serilog__WriteTo__1__Args__serverUrl: http://seq:80
      ASPNETCORE_URLS: http://+:80
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5002:80"
    networks:
      - trading-network
        
  postgres:
    image: postgres:15
    container_name: postgres-container
    restart: always
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    networks:
      - trading-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-container
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      
      
    ports:
      - "5050:80"
    networks:
      - trading-network
      
networks:
  trading-network:
    driver: bridge
  
volumes:
    vault-data:
    redis-data: